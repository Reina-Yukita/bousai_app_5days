{% extends "base.html" %}

{% block content %}
<style>
    .home-content {
        width: min(100% - 32px, 910px);
        margin: 32px auto 64px;
    }

    .home-card {
        margin-bottom: 34px;
        padding: 28px;
        background: #fff;
        border: 1px solid #edf1f6;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(44, 74, 119, 0.08);
    }

    .section-heading {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 20px;
        color: #2257aa;
        font-size: 24px;
    }

    .section-heading .heading-icon { font-size: 26px; }

    #shelterMap {
        height: 365px;
        overflow: hidden;
        border-radius: 12px;
    }

    .weather-heading { justify-content: space-between; }

    .update-label {
        color: #199447;
        font-size: 16px;
        font-weight: 700;
        white-space: nowrap;
    }

    .weather-panel {
        padding: 24px;
        background: #f8fafc;
        border-radius: 12px;
    }

    .weather-panel p { margin: 10px 0; }

    .weather-area {
        font-size: 18px;
        font-weight: 700;
    }

    .weather-status {
        color: #199447;
        font-size: 18px;
        font-weight: 700;
    }

    .weather-status.is-warning { color: #c77700; }

    .weather-meta {
        color: #5f6e82;
        font-size: 14px;
    }

    @media (max-width: 600px) {
        .home-content { width: min(100% - 20px, 910px); margin-top: 20px; }
        .home-card { padding: 16px; margin-bottom: 20px; }
        .section-heading { font-size: 20px; }
        .update-label { font-size: 13px; }
        #shelterMap { height: 300px; }
        .weather-panel { padding: 16px; }
    }
</style>

<div class="home-content">
    <section class="home-card" aria-labelledby="mapHeading">
        <h2 class="section-heading" id="mapHeading"><span class="heading-icon" aria-hidden="true">📍</span>避難所マップ</h2>
        <div id="shelterMap"></div>
    </section>

    <section class="home-card" aria-labelledby="weatherHeading">
        <h2 class="section-heading weather-heading" id="weatherHeading">
            <span><span class="heading-icon" aria-hidden="true">🌤️</span> 青森市 気象警報・注意報</span>
            <span class="update-label">↻ 10分おき自動更新</span>
        </h2>
        <div id="weatherContent" class="weather-panel">
            <p>読み込み中...</p>
        </div>
    </section>
</div>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（青森市周辺を中心に設定）
    const map = L.map('shelterMap').setView([40.8246, 140.7400], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p class="weather-status is-warning">気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul>';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="weather-status">● 現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p class="weather-area">📍 ${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p class="weather-meta">◷ データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
            <p class="weather-meta">⌁ 気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
