{% extends "base.html" %}

{% block title %}管理者ログイン{% endblock %}

{% block content %}
<section class="page-card simple-page form-page">
<p class="section-eyebrow">ADMIN ACCESS</p>
<h2>管理者ログイン</h2>
<p>指示ボード・避難所登録の利用には管理者権限が必要です。</p>

{% if error %}
  <p class="error-message">{{ message }}</p>
{% endif %}

<form method="post">
  <!-- リダイレクト先URLを保持 -->
  {% if next %}
    <input type="hidden" name="next" value="{{ next }}">
  {% endif %}

  <p>
    <label for="password">パスワード</label><br>
    <input class="form-control" type="password" id="password" name="password" required>
  </p>

  <p><button class="button" type="submit">ログイン</button></p>
</form>
</section>
{% endblock %}
